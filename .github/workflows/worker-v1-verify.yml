# Проверки production worker v1. Ничего не деплоит и не публикует.
#
# Зачем: worker v1 до сих пор гонялся в тестах только на машинах разработки, где
# сборка FFmpeg новее и без libass. Именно поэтому баг звукового тракта на
# FFmpeg 6.1 + libass (loudnorm@192кГц → amix теряет ведущий звук на коротких
# роликах) проявился лишь в проде на Ubuntu. Джоба воспроизводит окружение
# рабочего образа: тот же ffmpeg из репозиториев Ubuntu (6.1.x, с libass) и те
# же шрифты, что ставит Dockerfile worker v1.

name: worker v1 verify

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/worker/**'
      - '.github/workflows/worker-v1-verify.yml'
  workflow_dispatch:

# Только чтение: workflow ничего не изменяет во внешнем мире.
permissions:
  contents: read

jobs:
  node-tests:
    name: Тесты worker v1 (Ubuntu, FFmpeg + libass)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ffmpeg из репозиториев Ubuntu собран с libass и libx264. Шрифты
      # обязательны: раннер почти пуст, а на пустом наборе шрифтов libass
      # завершает subtitles с ошибкой. Рабочий образ ставит те же
      # fonts-dejavu-core — джоба воспроизводит его окружение.
      - name: Установить ffmpeg и шрифты
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core fontconfig
          fc-list | wc -l
          ffmpeg -hide_banner -version | head -1
          ffmpeg -hide_banner -filters | grep -q ' subtitles ' \
            || (echo 'ffmpeg без libass — проверка субтитров не будет воспроизведена' && exit 1)

      - name: npm test
        working-directory: backend/worker
        run: npm test
