name: CI & Deploy (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Единственный workflow, публикующий в Pages. Раньше их было два с РАЗНЫМИ
# группами concurrency: они не сериализовались между собой, и побеждал тот, кто
# финишировал последним. Второй собирал без REELIO_BACKEND_URL, то есть в
# демо-режиме, — сайт случайным образом оказывался без backend'а.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # ── Проверка: формат, анализ, тесты. Публикация не идёт, если упало. ──
  verify:
    name: Verify (format · analyze · test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - run: flutter pub get
      - name: Format check
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test

  # ── Сборка Web и публикация через официальный GitHub Pages workflow. ──
  deploy:
    name: Build & Deploy
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - run: flutter pub get
      - name: Build web
        # Все три dart-define — НЕсекретные repo variables (URL и feature flag).
        # Ключ Gemini НИКОГДА не передаётся в сборку и не попадает в Pages
        # artifact. Если REELIO_V2_ENABLED/REELIO_BETA_BACKEND_URL не заданы,
        # они разворачиваются в пустую строку: v2Enabled → false, и сборка
        # безопасно остаётся v1 (§4C.9).
        run: >
          flutter build web --release
          --base-href /reelio-ai-web/
          --dart-define=REELIO_BACKEND_URL=${{ vars.REELIO_BACKEND_URL }}
          --dart-define=REELIO_BETA_BACKEND_URL=${{ vars.REELIO_BETA_BACKEND_URL }}
          --dart-define=REELIO_V2_ENABLED=${{ vars.REELIO_V2_ENABLED }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
