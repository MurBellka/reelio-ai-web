# Builds the Flutter Web version and publishes it to GitHub Pages.
#
# Responsibility split (see also flutter-checks.yml):
#   * This workflow OWNS the release build + publish of the web demo. Because it
#     gates a public deployment it self-contains `flutter analyze` and
#     `flutter test` as a safety net.
#   * flutter-checks.yml owns `dart format` verification and fast validation on
#     every pull request (where this deploy workflow does not run).
#
# No tokens or secrets are configured here. GitHub Pages publishing uses the
# built-in OIDC token via the permissions block below.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allow manual re-deploys from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two Pages publishes at the same time.
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build:
    name: Build web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter (latest stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Print versions
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Run tests
        run: flutter test

      # GitHub Pages serves a project site from https://USER.github.io/REPO/.
      # The app therefore lives in the "/REPO/" sub-path. We derive REPO from
      # the built-in GITHUB_REPOSITORY variable ("owner/repo") so the repository
      # name is never hard-coded in the source.
      - name: Compute base href from repository name
        id: basehref
        run: echo "href=/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_OUTPUT"

      - name: Build Flutter Web (release)
        run: flutter build web --release --base-href "${{ steps.basehref.outputs.href }}"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Publish to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
